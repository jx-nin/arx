[project]
name = "arx"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "jx-nin" }
]
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
arx = "arx:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "sphinx>=9.2.0",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# E/W/F = flake8, I = import order, D = docstrings, N = naming, B = bugbears, UP = modern syntax
select = ["E", "W", "F", "I", "D", "N", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=arx --cov-report=term-missing"
# Tests mirror src/arx/; the test level comes from a marker, not a folder.
markers = [
    "req(id): requirement ID from docs/spec/tds.md this test covers, e.g. FR-ING-03",
    "integration: needs real services (PostgreSQL via testcontainers)",
    "contract: parses recorded external responses (arXiv fixtures)",
    "golden: conversion snapshot test against representative papers",
]

[tool.coverage.report]
fail_under = 90
